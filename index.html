<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Una Galaxia de Amor para Ti ✨</title>

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Librería 3D Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --primary: #ff2a70;
      --secondary: #ff758f;
      --bg-dark: #060108;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* PANTALLA INICIAL (BIENVENIDA) */
    #welcome-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(30, 8, 24, 0.88) 0%, rgba(5, 1, 8, 0.98) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 1.2s;
    }

    #welcome-screen.dissolve {
      opacity: 0;
      transform: scale(2.2);
      filter: blur(25px);
      pointer-events: none;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 117, 143, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 45px 28px;
      border-radius: 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(255, 42, 112, 0.25);
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope-icon {
      font-size: 50px;
      margin-bottom: 18px;
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(255, 42, 112, 0.8));
    }

    .welcome-card h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 0%, #ffcad4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }

    .welcome-card p {
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 32px;
    }

    .btn-enter {
      background: linear-gradient(135deg, #ff2a70 0%, #b5179e 100%);
      color: #ffffff;
      border: none;
      padding: 15px 32px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 42, 112, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-enter:active {
      transform: scale(0.96);
    }

    /* MODAL DE RECUERDO INTERACTIVO */
    #memory-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .modal-card {
      background: rgba(20, 6, 18, 0.94);
      border: 1px solid rgba(255, 42, 112, 0.45);
      border-radius: 28px;
      padding: 30px 22px 25px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 42, 112, 0.35);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-badge {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 3px solid #140612;
      box-shadow: 0 0 15px rgba(255, 42, 112, 0.8);
    }

    .modal-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 18px;
      margin: 12px 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 0.9rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 22px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* BOTÓN MÚSICA */
    .audio-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 46px;
      height: 46px;
      background: rgba(255, 42, 112, 0.35);
      border: 1px solid rgba(255, 42, 112, 0.6);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 40;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto"></audio>
  <button id="musicToggle" class="audio-btn" style="display: none;" aria-label="Música">🎵</button>

  <!-- PANTALLA 1: BIENVENIDA -->
  <section id="welcome-screen">
    <div class="welcome-card">
      <div class="envelope-icon">💌</div>
      <h1 id="cfgWelcomeTitle">Una Galaxia de Amor para Ti</h1>
      <p id="cfgWelcomeSubtitle">FELIZ CUMPLEAÑOS, MI VIDA</p>
      <button class="btn-enter" id="btnEnter">ENTRAR A NUESTRO UNIVERSO</button>
    </div>
  </section>

  <!-- PANTALLA 2: LIENZO 3D -->
  <div id="canvas-container"></div>

  <!-- PANTALLA 3: MODAL DE RECUERDO INTERACTIVO -->
  <div id="memory-modal">
    <div class="modal-card">
      <div class="modal-badge">❤️</div>
      <img src="" id="modalImg" class="modal-img" alt="Recuerdo">
      <h2 id="modalTitle" class="modal-title">Amor de mi Vida</h2>
      <p id="modalText" class="modal-text">Mensaje romántico...</p>
      <button class="btn-back" id="btnBack">VOLVER ❤️</button>
    </div>
  </div>

  <script>
    /* ========================================================
     *  CONFIGURACIÓN RÁPIDA
     * ======================================================== */
    const CONFIG = {
      welcomeTitle: "Una Galaxia de Amor para Ti",
      welcomeSubtitle: "FELIZ CUMPLEAÑOS, MI VIDA",
      welcomeButtonText: "ENTRAR A NUESTRO UNIVERSO",

      musicUrl: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3",

      orbitingPhrases: [
        "AMOR DE MI VIDA",
        "ERES MAGIA",
        "FELIZ CUMPLEAÑOS",
        "MI PERSONA FAVORITA",
        "SIEMPRE JUNTOS",
        "PARA SIEMPRE",
        "TE ADORO",
        "MI UNIVERSO ENTERO"
      ],

      memories: [
        {
          title: "Amor de mi Vida",
          text: "Cuanto más tiempo estamos juntos, más te amo.",
          image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&auto=format&fit=crop",
          badge: "👩‍❤️‍👨"
        },
        {
          title: "Para Ti",
          text: "Que haces latir mi corazón de una forma única en cada recuerdo.",
          image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=600&auto=format&fit=crop",
          badge: "💖"
        },
        {
          title: "Para Siempre",
          text: "No me importa cuántas vidas existan, en cada una de ellas te elegiría a ti.",
          image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600&auto=format&fit=crop",
          badge: "✨"
        },
        {
          title: "Nuestro Destino",
          text: "El universo entero conspiró para que tú y yo nos encontráramos.",
          image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop",
          badge: "🌹"
        }
      ]
    };

    document.getElementById('cfgWelcomeTitle').textContent = CONFIG.welcomeTitle;
    document.getElementById('cfgWelcomeSubtitle').textContent = CONFIG.welcomeSubtitle;
    document.getElementById('btnEnter').textContent = CONFIG.welcomeButtonText;

    const bgAudio = document.getElementById('bgMusic');
    bgAudio.src = CONFIG.musicUrl;

    /* ========================================================
     *  MOTOR THREE.JS 3D
     * ======================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060108, 0.022);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4.8, 65); // Inicia lejos para el túnel de warp

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 3.6, 0);
    controls.autoRotate = false;
    controls.maxDistance = 40;
    controls.minDistance = 6;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;

    /* Textura de partículas radiales */
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.25, 'rgba(255, 70, 150, 0.9)');
      gradient.addColorStop(0.6, 'rgba(190, 10, 90, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const particleTexture = createGlowTexture();

    /* 1. TÚNEL DE VELOCIDAD LUZ (WARP) */
    const warpCount = 2000;
    const warpGeo = new THREE.BufferGeometry();
    const warpPos = new Float32Array(warpCount * 3);
    const warpSpeeds = new Float32Array(warpCount);

    for (let i = 0; i < warpCount; i++) {
      const i3 = i * 3;
      const angle = Math.random() * Math.PI * 2;
      const radius = 2 + Math.random() * 22;
      warpPos[i3] = Math.cos(angle) * radius;
      warpPos[i3 + 1] = Math.sin(angle) * radius + 3.6;
      warpPos[i3 + 2] = (Math.random() - 0.5) * 120;
      warpSpeeds[i] = 0.8 + Math.random() * 1.4;
    }

    warpGeo.setAttribute('position', new THREE.BufferAttribute(warpPos, 3));
    const warpMat = new THREE.PointsMaterial({
      size: 0.42,
      map: particleTexture,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0
    });
    const warpParticles = new THREE.Points(warpGeo, warpMat);
    scene.add(warpParticles);

    /* 2. Estrellas de fondo lejanas */
    const starCount = 3000;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 150;
      starPos[i + 1] = (Math.random() - 0.5) * 150;
      starPos[i + 2] = (Math.random() - 0.5) * 150;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      size: 0.35,
      color: 0xffd6e0,
      transparent: true,
      opacity: 0.8
    });
    scene.add(new THREE.Points(starGeo, starMat));

    /* 3. Galaxia Espiral (Piso) */
    const galaxyParams = {
      count: 24000,
      size: 0.22,
      radius: 16.5,
      branches: 3,
      spin: 1.35,
      randomness: 0.4,
      power: 3.2,
      insideColor: '#ffe5ec',
      outsideColor: '#a00037'
    };

    const galaxyGeo = new THREE.BufferGeometry();
    const galaxyPos = new Float32Array(galaxyParams.count * 3);
    const galaxyColors = new Float32Array(galaxyParams.count * 3);
    const cInside = new THREE.Color(galaxyParams.insideColor);
    const cOutside = new THREE.Color(galaxyParams.outsideColor);

    for (let i = 0; i < galaxyParams.count; i++) {
      const i3 = i * 3;
      const r = Math.random() * galaxyParams.radius;
      const spinAngle = r * galaxyParams.spin;
      const branchAngle = ((i % galaxyParams.branches) * (2 * Math.PI)) / galaxyParams.branches;

      const randomX = Math.pow(Math.random(), galaxyParams.power) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * r;
      const randomY = Math.pow(Math.random(), galaxyParams.power) * (Math.random() < 0.5 ? 1 : -1) * (galaxyParams.randomness * 0.25) * r;
      const randomZ = Math.pow(Math.random(), galaxyParams.power) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * r;

      galaxyPos[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
      galaxyPos[i3 + 1] = randomY;
      galaxyPos[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

      const mixedColor = cInside.clone().lerp(cOutside, r / galaxyParams.radius);
      galaxyColors[i3] = mixedColor.r;
      galaxyColors[i3 + 1] = mixedColor.g;
      galaxyColors[i3 + 2] = mixedColor.b;
    }

    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPos, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

    const galaxyMat = new THREE.PointsMaterial({
      size: galaxyParams.size,
      map: particleTexture,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0
    });

    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    galaxy.scale.set(0.001, 0.001, 0.001);
    galaxy.visible = false; // Oculto hasta la sincronización
    scene.add(galaxy);

    /* 4. Vórtice de luz vertical */
    const vortexCount = 1800;
    const vortexGeo = new THREE.BufferGeometry();
    const vortexPos = new Float32Array(vortexCount * 3);
    const vortexColors = new Float32Array(vortexCount * 3);
    const vColorBottom = new THREE.Color('#ffffff');
    const vColorTop = new THREE.Color('#ff0055');

    for (let i = 0; i < vortexCount; i++) {
      const i3 = i * 3;
      const progress = Math.random();
      const y = progress * 3.4;
      const angle = progress * Math.PI * 8 + Math.random() * 0.5;
      const radius = (1 - progress) * 1.8 * Math.random();

      vortexPos[i3] = Math.cos(angle) * radius;
      vortexPos[i3 + 1] = y;
      vortexPos[i3 + 2] = Math.sin(angle) * radius;

      const mixed = vColorBottom.clone().lerp(vColorTop, progress);
      vortexColors[i3] = mixed.r;
      vortexColors[i3 + 1] = mixed.g;
      vortexColors[i3 + 2] = mixed.b;
    }
    vortexGeo.setAttribute('position', new THREE.BufferAttribute(vortexPos, 3));
    vortexGeo.setAttribute('color', new THREE.BufferAttribute(vortexColors, 3));
    const vortexMat = new THREE.PointsMaterial({
      size: 0.28,
      map: particleTexture,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0
    });
    const vortex = new THREE.Points(vortexGeo, vortexMat);
    vortex.scale.set(0.001, 0.001, 0.001);
    vortex.visible = false; // Oculto hasta la sincronización
    scene.add(vortex);

    /* 5. Corazón 3D Frontal */
    const heartCount = 4200;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const hColorA = new THREE.Color('#ffffff');
    const hColorB = new THREE.Color('#ff0055');

    for (let i = 0; i < heartCount; i++) {
      const i3 = i * 3;
      const t = Math.PI * 2 * Math.random();

      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      const thickness = (1 - Math.abs(x) / 16) * 4.5 + 0.8;
      let z = (Math.random() - 0.5) * thickness;

      const fill = Math.pow(Math.random(), 0.35);
      const scale = 0.22;

      heartPos[i3] = x * fill * scale;
      heartPos[i3 + 1] = y * fill * scale + 4.3;
      heartPos[i3 + 2] = z * fill * scale;

      const mixed = hColorA.clone().lerp(hColorB, fill);
      heartColors[i3] = mixed.r;
      heartColors[i3 + 1] = mixed.g;
      heartColors[i3 + 2] = mixed.b;
    }

    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartMat = new THREE.PointsMaterial({
      size: 0.32,
      map: particleTexture,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0
    });

    const heart = new THREE.Points(heartGeo, heartMat);
    heart.scale.set(0.001, 0.001, 0.001);
    heart.visible = false; // Oculto hasta la sincronización
    scene.add(heart);

    /* 6. Frases y Recuerdos en Órbita */
    const orbitingGroup = new THREE.Group();
    orbitingGroup.scale.set(0.001, 0.001, 0.001);
    orbitingGroup.visible = false; // Oculto hasta la sincronización
    scene.add(orbitingGroup);
    const interactiveSprites = [];

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold 44px "Poppins", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff2a70';
      ctx.shadowBlur = 18;
      ctx.fillText(text, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false, opacity: 0 });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(4.4, 1.1, 1);
      return sprite;
    }

    function createMemorySprite(badgeText) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.beginPath();
      ctx.arc(128, 128, 95, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 42, 112, 0.45)';
      ctx.shadowColor = '#ff2a70';
      ctx.shadowBlur = 24;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(128, 128, 80, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.font = '70px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, 128, 134);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0 });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2.2, 2.2, 1);
      return sprite;
    }

    CONFIG.orbitingPhrases.forEach((phrase, idx) => {
      const sprite = createTextSprite(phrase);
      const total = CONFIG.orbitingPhrases.length;
      sprite.userData = {
        radius: 6 + Math.random() * 8,
        angle: (idx / total) * Math.PI * 2,
        speed: 0.003,
        yOffset: (Math.random() - 0.5) * 2.5 + 1.2,
        isInteractive: false
      };
      orbitingGroup.add(sprite);
    });

    CONFIG.memories.forEach((mem, idx) => {
      const sprite = createMemorySprite(mem.badge || "💌");
      const total = CONFIG.memories.length;
      sprite.userData = {
        radius: 8 + Math.random() * 5.5,
        angle: (idx / total) * Math.PI * 2 + 0.35,
        speed: 0.0035,
        yOffset: (Math.random() - 0.5) * 3 + 1.8,
        isInteractive: true,
        data: mem
      };
      orbitingGroup.add(sprite);
      interactiveSprites.push(sprite);
    });

    /* ========================================================
     *  LÓGICA DE TRANSICIÓN 100% SINCRONIZADA
     * ======================================================== */
    const welcomeScreen = document.getElementById('welcome-screen');
    const btnEnter = document.getElementById('btnEnter');
    const musicBtn = document.getElementById('musicToggle');

    let transitionState = 0; // 0: Reposo, 1: Túnel Warp, 2: Revelación Sincronizada, 3: Listo
    let revealProgress = 0; // Controlador maestro de aparición de 0 a 1
    const targetCameraZ = 16.5;
    const targetCameraY = 4.8;

    btnEnter.addEventListener('click', () => {
      bgAudio.play().then(() => {
        musicBtn.textContent = "⏸️";
      }).catch(e => console.warn(e));
      musicBtn.style.display = 'flex';

      welcomeScreen.classList.add('dissolve');
      setTimeout(() => welcomeScreen.style.display = 'none', 1200);

      // Inicia el túnel warp
      transitionState = 1;
      warpMat.opacity = 0.95;

      // Tras 1.4s de túnel, nace TODO el universo de forma simultánea
      setTimeout(() => {
        transitionState = 2;
        // Se activan todos los elementos en el mismo milisegundo
        galaxy.visible = true;
        vortex.visible = true;
        heart.visible = true;
        orbitingGroup.visible = true;
      }, 1400);
    });

    musicBtn.addEventListener('click', () => {
      if (bgAudio.paused) {
        bgAudio.play();
        musicBtn.textContent = "⏸️";
      } else {
        bgAudio.pause();
        musicBtn.textContent = "🎵";
      }
    });

    /* Modal de recuerdos */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let startX = 0, startY = 0;

    const modal = document.getElementById('memory-modal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const btnBack = document.getElementById('btnBack');

    window.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveSprites);

      if (intersects.length > 0) {
        openMemory(intersects[0].object.userData.data);
      }
    });

    function openMemory(data) {
      modalImg.src = data.image;
      modalTitle.textContent = data.title;
      modalText.textContent = data.text;
      modal.style.display = 'flex';
      setTimeout(() => {
        modal.style.opacity = '1';
        document.querySelector('.modal-card').style.transform = 'scale(1)';
      }, 10);
    }

    btnBack.addEventListener('click', () => {
      modal.style.opacity = '0';
      document.querySelector('.modal-card').style.transform = 'scale(0.9)';
      setTimeout(() => {
        modal.style.display = 'none';
      }, 300);
    });

    /* ========================================================
     *  BUCLE PRINCIPAL (RENDER Y SINCRONIZACIÓN)
     * ======================================================== */
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // FASE 1: TÚNEL DE VELOCIDAD
      if (transitionState === 1) {
        const positions = warpGeo.attributes.position.array;
        for (let i = 0; i < warpCount; i++) {
          const i3 = i * 3;
          positions[i3 + 2] += warpSpeeds[i] * 3.8;
          if (positions[i3 + 2] > 70) {
            positions[i3 + 2] = -50;
          }
        }
        warpGeo.attributes.position.needsUpdate = true;
        camera.position.z -= 0.65;
      }

      // FASE 2: REVELACIÓN 100% SIMULTÁNEA DE TODOS LOS ELEMENTOS
      if (transitionState === 2) {
        // Desvanecer túnel de estrellas
        warpMat.opacity = Math.max(0, warpMat.opacity - 0.06);
        if (warpMat.opacity <= 0.01) warpParticles.visible = false;

        // Cámara se asienta suavemente
        camera.position.z += (targetCameraZ - camera.position.z) * 0.045;
        camera.position.y += (targetCameraY - camera.position.y) * 0.045;

        // Avance único y común de 0 a 1
        revealProgress = Math.min(1, revealProgress + 0.022);
        
        // Curva suave elástica (Cubic Out)
        const p = 1 - Math.pow(1 - revealProgress, 3);

        // APLICACIÓN SIMULTÁNEA EXACTA: ESCALA Y OPACIDAD DE TODO A LA VEZ
        galaxy.scale.set(p, p, p);
        vortex.scale.set(p, p, p);
        orbitingGroup.scale.set(p, p, p);

        // Latido armónico integrado al tamaño
        const heartPulse = 1 + Math.sin(elapsedTime * 3.2) * 0.045;
        const currentHeartScale = p * heartPulse;
        heart.scale.set(currentHeartScale, currentHeartScale, currentHeartScale);

        // Opacidad compartida idéntica
        galaxyMat.opacity = p;
        vortexMat.opacity = p;
        heartMat.opacity = p;
        orbitingGroup.children.forEach(child => {
          child.material.opacity = p;
        });

        // Conclusión de la transición
        if (revealProgress >= 1 && Math.abs(camera.position.z - targetCameraZ) < 0.15) {
          transitionState = 3;
        }
      }

      // ESTADO REGULAR (POST-TRANSICIÓN)
      if (transitionState >= 2) {
        galaxy.rotation.y = elapsedTime * 0.045;
        vortex.rotation.y = elapsedTime * 0.12;

        if (transitionState === 3) {
          const heartPulse = 1 + Math.sin(elapsedTime * 3.2) * 0.045;
          heart.scale.set(heartPulse, heartPulse, heartPulse);
        }

        // Movimiento orbital de frases y recuerdos
        orbitingGroup.children.forEach(child => {
          child.userData.angle += child.userData.speed;
          child.position.x = Math.cos(child.userData.angle) * child.userData.radius;
          child.position.z = Math.sin(child.userData.angle) * child.userData.radius;
          child.position.y = child.userData.yOffset + Math.sin(elapsedTime * 1.5 + child.userData.angle) * 0.2;
        });
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
